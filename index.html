<style>
html,body{margin:0;height:100%}body{font-family:Pretendard,"Malgun Gothic",-apple-system,sans-serif;background:linear-gradient(180deg,#2B1A33,#6B2F45 60%,#D06A40);color:#fff;display:grid;place-items:center}
.box{width:min(380px,90vw);background:rgba(20,12,24,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:34px 30px;box-shadow:0 30px 60px rgba(0,0,0,.35)}

.err{color:#FFB4A0;font-size:13px;min-height:18px;margin-top:10px}a{color:#F2B98A}

async function dec(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},k,ub(P.c)));}
async function derive(id,pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(id+':'+pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(P.s),iterations:P.n,hash:'SHA-256'},b,256));}
