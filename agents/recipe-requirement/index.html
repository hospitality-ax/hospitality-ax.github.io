const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), bu=b=>{let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s);};
async function dec(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},k,ub(P.c)));}
async function derive(id,pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(id+':'+pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(P.s),iterations:P.n,hash:'SHA-256'},b,256));}
async function show(h){if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));document.open();document.write(h);document.close();}
(async()=>{let k=null;try{k=localStorage.getItem('hax.k');}catch(e){}
 if(k){let h=null;try{h=await dec(ub(k));}catch(e){}if(h!==null){await show(h);return;}try{localStorage.removeItem('hax.k');}catch(x){}}
 document.getElementById('gate').hidden=false;
